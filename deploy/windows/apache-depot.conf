# Place this file at C:\Apache24\conf\extra\depot.conf and add this line near
# the other Include lines in C:\Apache24\conf\httpd.conf:
#
#     Include conf/extra/depot.conf
#
# Replace DEPOT-SERVER below with the Windows computer name or the custom
# hostname used in APP_URL.

<VirtualHost *:80>
    ServerName DEPOT-SERVER
    ServerAlias DEPOT-SERVER depot.lan
    DocumentRoot "C:/depot/public"
    DirectoryIndex index.php index.html

    <Directory "C:/depot/public">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    ErrorLog "logs/depot-error.log"
    CustomLog "logs/depot-access.log" combined
</VirtualHost>
